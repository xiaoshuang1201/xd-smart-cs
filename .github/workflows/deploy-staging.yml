name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          docker build -f packages/server/Dockerfile -t ghcr.io/${{ github.repository }}/nest-backend:staging .
          docker build -f apps/web/Dockerfile -t ghcr.io/${{ github.repository }}/nuxt-web:staging .
          docker build -f apps/admin/Dockerfile -t ghcr.io/${{ github.repository }}/admin-frontend:staging .
          docker push ghcr.io/${{ github.repository }}/nest-backend:staging
          docker push ghcr.io/${{ github.repository }}/nuxt-web:staging
          docker push ghcr.io/${{ github.repository }}/admin-frontend:staging

      - name: Deploy to Staging Server
        run: |
          echo "[Staging] Deployment triggered."
          echo "[Staging] Images: ghcr.io/${{ github.repository }}/*:staging"
